# The quick check and the audio tests, on every push to main and every pull request.
#
# Games pin tags of this repository, so a run here is the last thing between a change and their builds.
#
# Each action is pinned by the commit it was read at, with its release in the comment:
#   actions/checkout    v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node  v7.1.0  949feb2413d6458794dcd2491c4babbbce0c15c1
# (read on 18 October 2026, the latest release of each). The kit's rule would let GitHub's own actions stay on their
# major tags; the pin is stricter, and a bot moves it.
#
# The audio tests run here, unlike render's GPU ones, because Web Audio needs no hardware: headless Chromium runs an
# AudioContext on a runner as it does on a laptop. Chromium is fetched with its system libraries, which is why the job
# installs it before the tests and not with `npm ci`.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:quick
      - run: npx playwright install chromium --with-deps
      - run: npm run test:audio
      - run: npm run size
